apiVersion: v1
kind: Service
metadata:
  name: ebs-user-account-sv
spec:
  type: NodePort
  selector:
    app: ebs-user-account-sel
  ports:
    - name: app-port
      port: 7002
      protocol: TCP
      targetPort: 8080
      nodePort: 30702
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ebs-user-account-app
spec:

  serviceName: ebs-user-account-sv
  replicas: 1
  selector:
    matchLabels:
      app: ebs-user-account-sel
  template:
    metadata:
      labels:
        app: ebs-user-account-sel
    spec:
      initContainers:
        - name: wait-for-keycloak
          image: curlimages/curl  # Lightweight image with curl
          command: ['sh', '-c',
            'echo "Starting health check...";
            until curl -s -f -o /dev/null http://ebs-keycloak-sv:9000/health/ready; do 
            echo "Waiting for dependent-service...";
            sleep 2; 
          done']
      containers:
        - name: ebs-user-account-cnt
          image: localhost/ebs-user-account-app-uat:1.2
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_HOST
              value: ebs-mysql-sv
            - name: DATABASE_PORT
              value: "3306"
            - name: DATABASE_NAME
              value: "eazybank_uat"
            - name: DATABASE_USERNAME
              value: "root"
            - name: DATABASE_PASSWORD
              value: "root"
            - name: MY_PORT
              value: "8080"
            - name: KEYCLOAK_HOST
              value: "ebs-keycloak-sv"
            - name: KEYCLOAK_PORT
              value: "5002"

